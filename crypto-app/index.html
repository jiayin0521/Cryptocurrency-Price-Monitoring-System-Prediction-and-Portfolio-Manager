<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CrypCoin — Cryptocurrency Price Monitor</title>
    <meta name="description" content="Real-time cryptocurrency prices, technical analysis, prediction, and portfolio tracking.">
    <link rel="stylesheet" href="css/styles.css">

    <!-- Apply saved theme immediately to avoid a flash of light theme on load.
         This tiny inline script runs before the body renders. -->
    <script>
        (function () {
            try {
                var saved = localStorage.getItem('crypcoin-theme');
                if (saved === 'dark') {
                    document.documentElement.setAttribute('data-theme', 'dark');
                }
            } catch (e) { /* localStorage blocked — default to light */ }
        })();
    </script>
</head>
<body>

    <!-- ============ Site header ============ -->
    <header class="site-header">
        <div class="header-container">
            <a href="index.html" class="logo">
                <span class="logo-mark">F</span>
                <span>CrypCoin</span>
            </a>
            <nav class="main-nav">
                <a href="index.html" class="nav-link">Dashboard</a>
                <a href="pages/portfolio.html" class="nav-link">Portfolio</a>
                <a href="pages/prediction.html" class="nav-link">Prediction</a>
                <a href="pages/about.html" class="nav-link">About</a>

                <!-- Theme toggle: SVG icons drawn from scratch.
                     Sun shows in dark mode (click to go light).
                     Moon shows in light mode (click to go dark). -->
                <button id="theme-toggle" class="theme-toggle"
                        aria-label="Toggle light or dark theme" title="Toggle theme">
                    <!-- Sun icon: a circle with eight rays -->
                    <svg class="icon-sun" viewBox="0 0 24 24" fill="none"
                         stroke="currentColor" stroke-width="2"
                         stroke-linecap="round" stroke-linejoin="round">
                        <circle cx="12" cy="12" r="4"/>
                        <line x1="12" y1="2"  x2="12" y2="4"/>
                        <line x1="12" y1="20" x2="12" y2="22"/>
                        <line x1="2"  y1="12" x2="4"  y2="12"/>
                        <line x1="20" y1="12" x2="22" y2="12"/>
                        <line x1="4.93"  y1="4.93"  x2="6.34"  y2="6.34"/>
                        <line x1="17.66" y1="17.66" x2="19.07" y2="19.07"/>
                        <line x1="4.93"  y1="19.07" x2="6.34"  y2="17.66"/>
                        <line x1="17.66" y1="6.34"  x2="19.07" y2="4.93"/>
                    </svg>
                    <!-- Moon icon: a crescent shape drawn with a single path -->
                    <svg class="icon-moon" viewBox="0 0 24 24" fill="none"
                         stroke="currentColor" stroke-width="2"
                         stroke-linecap="round" stroke-linejoin="round">
                        <path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"/>
                    </svg>
                </button>
            </nav>
        </div>
    </header>

    <!-- ============ Main content ============ -->
    <main class="page-container">

        <div class="page-header">
            <h1 class="page-title">Cryptocurrency Markets</h1>
            <p class="page-subtitle">Real-time prices, market data, and 24-hour changes for top cryptocurrencies.</p>
        </div>

        <!-- Global market stats -->
        <div id="global-stats" class="stat-grid">
            <!-- Populated by dashboard.js -->
        </div>

        <!-- Search -->
        <div class="search-wrapper">
            <svg class="search-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                <circle cx="11" cy="11" r="8"></circle>
                <line x1="21" y1="21" x2="16.65" y2="16.65"></line>
            </svg>
            <input type="text" id="search-input" class="search-input"
                   placeholder="Search by name or symbol (e.g. Bitcoin, BTC)..."
                   autocomplete="off">
        </div>

        <!-- Coin table -->
        <div class="coin-table-wrapper">
            <table class="coin-table">
                <thead>
                    <tr>
                        <th>#</th>
                        <th>Name</th>
                        <th class="numeric">Price</th>
                        <th class="numeric">24h %</th>
                        <th class="numeric hide-mobile">Market cap</th>
                        <th class="numeric hide-mobile">Volume (24h)</th>
                    </tr>
                </thead>
                <tbody id="coin-table-body">
                    <!-- Populated by dashboard.js -->
                </tbody>
            </table>
        </div>

    </main>

    <!-- ============ Footer ============ -->
    <footer class="site-footer">
        <p>CrypCoin &middot; Cryptocurrency Price Monitoring System &middot;
           Data provided by <a href="https://www.coingecko.com/" target="_blank" rel="noopener">CoinGecko</a></p>
    </footer>

    <!-- ============ Scripts (loaded in dependency order) ============ -->
    <script src="js/theme.js"></script>
    <script src="js/utils.js"></script>
    <script src="js/api.js"></script>
    <script src="js/dashboard.js"></script>
</body>
</html>
