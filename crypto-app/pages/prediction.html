<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Prediction — CrypCoin</title>
    <link rel="stylesheet" href="../css/styles.css">

    <!-- Apply saved theme immediately to avoid a flash of light theme on load -->
    <script>
        (function () {
            try {
                var saved = localStorage.getItem('crypcoin-theme');
                if (saved === 'dark') {
                    document.documentElement.setAttribute('data-theme', 'dark');
                }
            } catch (e) { /* localStorage blocked — default to light */ }
        })();
    </script>
</head>
<body>

    <!-- ============ Site header ============ -->
    <header class="site-header">
        <div class="header-container">
            <a href="../index.html" class="logo">
                <span class="logo-mark">F</span>
                <span>CrypCoin</span>
            </a>
            <nav class="main-nav">
                <a href="../index.html" class="nav-link">Dashboard</a>
                <a href="portfolio.html" class="nav-link">Portfolio</a>
                <a href="prediction.html" class="nav-link">Prediction</a>
                <a href="about.html" class="nav-link">About</a>

                <!-- Theme toggle: SVG icons drawn from scratch -->
                <button id="theme-toggle" class="theme-toggle"
                        aria-label="Toggle light or dark theme" title="Toggle theme">
                    <svg class="icon-sun" viewBox="0 0 24 24" fill="none"
                         stroke="currentColor" stroke-width="2"
                         stroke-linecap="round" stroke-linejoin="round">
                        <circle cx="12" cy="12" r="4"/>
                        <line x1="12" y1="2"  x2="12" y2="4"/>
                        <line x1="12" y1="20" x2="12" y2="22"/>
                        <line x1="2"  y1="12" x2="4"  y2="12"/>
                        <line x1="20" y1="12" x2="22" y2="12"/>
                        <line x1="4.93"  y1="4.93"  x2="6.34"  y2="6.34"/>
                        <line x1="17.66" y1="17.66" x2="19.07" y2="19.07"/>
                        <line x1="4.93"  y1="19.07" x2="6.34"  y2="17.66"/>
                        <line x1="17.66" y1="6.34"  x2="19.07" y2="4.93"/>
                    </svg>
                    <svg class="icon-moon" viewBox="0 0 24 24" fill="none"
                         stroke="currentColor" stroke-width="2"
                         stroke-linecap="round" stroke-linejoin="round">
                        <path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"/>
                    </svg>
                </button>
            </nav>
        </div>
    </header>

    <!-- ============ Main content (populated by prediction-page.js) ============ -->
    <main class="page-container" id="prediction-content">
        <div class="loading-state">
            <div class="loading-spinner"></div>
            <div>Loading...</div>
        </div>
    </main>

    <!-- ============ Footer ============ -->
    <footer class="site-footer">
        <p>CrypCoin &middot; Cryptocurrency Price Monitoring System &middot;
           Data provided by <a href="https://www.coingecko.com/" target="_blank" rel="noopener">CoinGecko</a></p>
    </footer>

    <!-- ============ External library: TradingView Lightweight Charts ============ -->
    <script src="https://unpkg.com/lightweight-charts@4.1.3/dist/lightweight-charts.standalone.production.js"></script>

    <!-- ============ Application scripts (load order matters) ============ -->
    <script src="../js/theme.js"></script>
    <script src="../js/utils.js"></script>
    <script src="../js/api.js"></script>
    <script src="../js/chart.js"></script>
    <script src="../js/prediction.js"></script>
    <script src="../js/prediction-page.js"></script>
</body>
</html>
